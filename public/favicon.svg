<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bandHubPickGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAFA" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
  </defs>

  <!-- Central hub - compact guitar pick shape -->
  <path
    d="M 32 20
       C 38 20, 42 22, 42 26
       C 42 30, 39 35, 37 39
       C 35 42, 33 44, 32 44
       C 31 44, 29 42, 27 39
       C 25 35, 22 30, 22 26
       C 22 22, 26 20, 32 20 Z"
    fill="url(#bandHubPickGradient)"
    opacity="0.15"
  />
  <path
    d="M 32 20
       C 38 20, 42 22, 42 26
       C 42 30, 39 35, 37 39
       C 35 42, 33 44, 32 44
       C 31 44, 29 42, 27 39
       C 25 35, 22 30, 22 26
       C 22 22, 26 20, 32 20 Z"
    stroke="url(#bandHubPickGradient)"
    stroke-width="2.5"
    fill="none"
  />

  <!-- "B" in center of pick -->
  <text
    x="32"
    y="35"
    text-anchor="middle"
    fill="#FAFAFA"
    font-size="12"
    font-weight="700"
    font-family="system-ui, -apple-system, sans-serif"
  >
    B
  </text>

  <!-- Spokes connecting to different aspects -->
  <g opacity="0.5">
    <line x1="32" y1="20" x2="32" y2="12" stroke="url(#bandHubPickGradient)" stroke-width="2" />
    <line x1="39" y1="24" x2="46" y2="20" stroke="url(#bandHubPickGradient)" stroke-width="2" />
    <line x1="42" y1="31" x2="52" y2="32" stroke="url(#bandHubPickGradient)" stroke-width="2" />
    <line x1="38" y1="38" x2="46" y2="44" stroke="url(#bandHubPickGradient)" stroke-width="2" />
    <line x1="32" y1="44" x2="32" y2="52" stroke="url(#bandHubPickGradient)" stroke-width="2" />
    <line x1="26" y1="38" x2="18" y2="44" stroke="url(#bandHubPickGradient)" stroke-width="2" />
    <line x1="22" y1="31" x2="12" y2="32" stroke="url(#bandHubPickGradient)" stroke-width="2" />
    <line x1="25" y1="24" x2="18" y2="20" stroke="url(#bandHubPickGradient)" stroke-width="2" />
  </g>

  <!-- Feature nodes -->
  <circle cx="32" cy="10" r="4.5" fill="url(#bandHubPickGradient)" opacity="0.9" />
  <circle cx="46" cy="18" r="4.5" fill="url(#bandHubPickGradient)" opacity="0.9" />
  <circle cx="54" cy="32" r="4.5" fill="url(#bandHubPickGradient)" opacity="0.9" />
  <circle cx="46" cy="46" r="4.5" fill="url(#bandHubPickGradient)" opacity="0.9" />
  <circle cx="32" cy="54" r="4.5" fill="url(#bandHubPickGradient)" opacity="0.9" />
  <circle cx="18" cy="46" r="4.5" fill="url(#bandHubPickGradient)" opacity="0.9" />
  <circle cx="10" cy="32" r="4.5" fill="url(#bandHubPickGradient)" opacity="0.9" />
  <circle cx="18" cy="18" r="4.5" fill="url(#bandHubPickGradient)" opacity="0.9" />

  <!-- Outer circle suggesting ecosystem -->
  <circle
    cx="32"
    cy="32"
    r="28"
    stroke="url(#bandHubPickGradient)"
    stroke-width="1"
    fill="none"
    opacity="0.2"
  />
</svg>
